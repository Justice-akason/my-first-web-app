<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Web App</title>
  <style>
    :root { --bg:#eaf1ff; --card:#fff; --text:#14213d; --muted:#53627a; --accent:#3157d5; --soft:#f2f5ff; --border:#d9e1f2; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; font-family:"Segoe UI",Arial,sans-serif; color:var(--text); background:radial-gradient(circle at 10% 10%,#cbd9ff,transparent 30%),radial-gradient(circle at 90% 90%,#ccefe7,transparent 28%),var(--bg); }
    main { width:min(680px,100%); padding:clamp(28px,6vw,56px); background:var(--card); border:1px solid var(--border); border-radius:28px; box-shadow:0 24px 60px #223a741f; }
    .eyebrow { margin:0 0 14px; color:var(--accent); font-size:.78rem; font-weight:800; letter-spacing:.15em; }
    h1 { margin:0 0 16px; font-size:clamp(2.25rem,7vw,4.2rem); line-height:1; letter-spacing:-.045em; }
    .intro { margin:0 0 36px; color:var(--muted); font-size:1.08rem; line-height:1.7; }
    section { padding:24px; background:var(--soft); border:1px solid var(--border); border-radius:18px; }
    h2 { margin:0 0 18px; font-size:1.25rem; }
    label { display:block; margin-bottom:8px; font-weight:700; }
    .row { display:flex; gap:10px; }
    input,button { min-height:48px; border-radius:11px; font:inherit; }
    input { min-width:0; flex:1; padding:0 14px; color:var(--text); background:var(--card); border:1px solid var(--border); outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 4px #3157d523; }
    button { padding:0 18px; color:#fff; background:var(--accent); border:0; font-weight:700; cursor:pointer; }
    button:hover { background:#2444ad; }
    #greeting { min-height:28px; margin:18px 0 0; color:var(--accent); font-weight:700; }
    footer { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-top:24px; color:var(--muted); font-size:.88rem; }
    #theme { min-height:auto; padding:8px 12px; color:var(--accent); background:transparent; border:1px solid var(--border); }
    body.dark { --bg:#080d1b; --card:#11192c; --text:#f3f6ff; --muted:#aab5cc; --accent:#83a2ff; --soft:#172138; --border:#293653; }
    @media(max-width:560px) { .row,footer { align-items:stretch; flex-direction:column; } footer { align-items:flex-start; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">MY FIRST WEB APP</p>
    <h1>Hello, I’m Justice.</h1>
    <p class="intro">I created this page in Visual Studio Code while learning the basics of HTML, CSS and JavaScript.</p>
    <section>
      <h2>Try the greeting generator</h2>
      <label for="name">What is your name?</label>
      <div class="row">
        <input id="name" type="text" placeholder="Enter your name" maxlength="40">
        <button id="greet" type="button">Say hello</button>
      </div>
      <p id="greeting" aria-live="polite">Your greeting will appear here.</p>
    </section>
    <footer>
      <span>Built with HTML, CSS and JavaScript</span>
      <button id="theme" type="button">Use dark mode</button>
    </footer>
  </main>
  <script>
    const nameInput=document.querySelector('#name');
    const greeting=document.querySelector('#greeting');
    document.querySelector('#greet').addEventListener('click',()=>{
      const name=nameInput.value.trim();
      greeting.textContent=name ? `Hello, ${name}! Welcome to my first web app.` : 'Please enter your name first.';
      if(!name) nameInput.focus();
    });
    nameInput.addEventListener('keydown',event=>{ if(event.key==='Enter') document.querySelector('#greet').click(); });
    document.querySelector('#theme').addEventListener('click',event=>{
      const dark=document.body.classList.toggle('dark');
      event.currentTarget.textContent=dark ? 'Use light mode' : 'Use dark mode';
    });
  </script>
</body>
</html>
